<template id="page-template">
  <article class="page-card">
    <header class="page-card-heading">
      <button class="page-toggle" type="button" aria-expanded="true">
        <span class="page-number"></span>
        <span class="page-summary">
          <code class="page-summary-id"></code>
          <span class="page-summary-component"></span>
        </span>
        <span class="page-toggle-icon" aria-hidden="true">⌄</span>
      </button>
      <button class="icon-button remove-page" type="button" aria-label="Eliminar página">Eliminar</button>
    </header>
    <div class="page-content">
      <div class="form-grid">
        <label>
          ID de página
          <input class="page-id" autocomplete="off" />
        </label>
        <label>
          Componente
          <select class="page-component"></select>
        </label>
        <label class="field-wide config-label">
          <span>Configuración de página (JSON)</span>
          <div class="json-editor">
            <pre class="json-highlight" aria-hidden="true"><code></code></pre>
            <textarea class="page-configuration" rows="12" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder='{"data":{}}' aria-label="Configuración de página JSON"></textarea>
          </div>
          <span class="configuration-status" aria-live="polite"></span>
          <ul class="configuration-diagnostics" aria-live="polite"></ul>
        </label>
      </div>
      <section class="routes-section">
        <div class="routes-heading">
          <div>
            <h3>Rutas</h3>
            <span class="field-hint">Define los destinos y, si hace falta, sus condiciones.</span>
          </div>
          <button class="button button-secondary button-small add-route" type="button">＋ Ruta</button>
        </div>
        <div class="routes-list"></div>
      </section>
    </div>
  </article>
</template>

<template id="route-template">
  <div class="route-card">
    <div class="route-topline">
      <span class="route-title"></span>
      <div class="route-actions">
        <button class="icon-button move-route-up" type="button" aria-label="Mover ruta hacia arriba">↑</button>
        <button class="icon-button move-route-down" type="button" aria-label="Mover ruta hacia abajo">↓</button>
        <button class="icon-button remove-route" type="button" aria-label="Eliminar ruta">×</button>
      </div>
    </div>
    <label>
      Ir a
      <select class="route-target"></select>
    </label>
    <div class="conditions-list"></div>
    <button class="button button-small button-secondary add-condition" type="button">＋ Condición</button>
  </div>
</template>

<template id="condition-template">
  <div class="condition-fields">
    <label class="condition-union">
      Unión
      <select class="condition-union-input">
        <option value="">Primera</option>
        <option value="AND">Y (AND)</option>
        <option value="OR">O (OR)</option>
        <option value="XOR">XOR</option>
        <option value="NOR">NOR</option>
        <option value="NAND">NAND</option>
        <option value="XNOR">XNOR</option>
      </select>
    </label>
    <label class="condition-expression">
      Expresión del contexto
      <input class="condition-expression-input" placeholder="client.isClient" autocomplete="off" />
    </label>
    <label class="condition-operation">
      Operador
      <select class="condition-operation-input">
        <option value="">=</option>
        <option value="===">===</option>
        <option value="!==">!==</option>
        <option value="&gt;">&gt;</option>
        <option value="&gt;=">&gt;=</option>
        <option value="&lt;">&lt;</option>
        <option value="&lt;=">&lt;=</option>
      </select>
    </label>
    <label class="condition-value">
      Valor de comparación
      <input class="condition-value-input" autocomplete="off" placeholder="true" />
    </label>
    <label class="condition-type">
      Tipo
      <select class="condition-type-input">
        <option value="string">Texto</option>
        <option value="boolean">Booleano</option>
        <option value="number">Número</option>
        <option value="null">Nulo</option>
        <option value="json">JSON</option>
      </select>
    </label>
    <button class="icon-button remove-condition" type="button" aria-label="Eliminar condición">×</button>
  </div>
</template>

<template id="step-template">
  <article class="step-card">
    <div class="step-card-heading">
      <h3 class="step-number"></h3>
      <button class="icon-button remove-step" type="button" aria-label="Eliminar paso">Eliminar</button>
    </div>
    <div class="form-grid step-fields">
      <label>
        ID del stepper
        <input class="stepper-id" autocomplete="off" value="main" />
      </label>
      <label>
        Etiqueta
        <input class="step-label" autocomplete="off" placeholder="Steps.PersonalData" />
      </label>
      <label>
        Tipo de etiqueta
        <select class="step-label-type">
          <option value="translate">Traducción</option>
          <option value="literal">Literal</option>
        </select>
      </label>
      <label>
        Herencia del contexto
        <select class="step-inherited">
          <option value="">Predeterminada</option>
          <option value="true">Heredar</option>
          <option value="false">Aislar este stepper</option>
        </select>
      </label>
    </div>
    <fieldset class="step-page-options">
      <legend>Páginas de este paso</legend>
      <div class="step-pages"></div>
    </fieldset>
  </article>
</template>
