<dialog class="confirmation-dialog" id="confirmation-dialog" aria-labelledby="confirmation-title" aria-describedby="confirmation-message">
  <div class="confirmation-card">
    <div class="confirmation-icon" aria-hidden="true">!</div>
    <div class="confirmation-content">
      <h2 id="confirmation-title">Please confirm</h2>
      <p id="confirmation-message"></p>
    </div>
    <div class="confirmation-actions">
      <button class="button button-secondary" id="confirmation-cancel" type="button">Cancel</button>
      <button class="button button-primary" id="confirmation-accept" type="button">Continue</button>
    </div>
  </div>
</dialog>
